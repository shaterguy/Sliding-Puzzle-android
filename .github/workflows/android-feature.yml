name: Android feature verification
on:
  push:
    branches: ['feature/v0.1.0-dev2-star-rating']
permissions:
  contents: read
concurrency:
  group: sliding-puzzle-feature-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - name: Static preflight
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/shaterguy/slidingpuzzle/StarRating.java
          test -f app/src/main/java/com/shaterguy/slidingpuzzle/StarMeterView.java
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          for path in pathlib.Path('app/src/main').rglob('*.xml'):
              ET.parse(path)
          print('XML syntax validated')
          PY
          grep -F "versionNameSuffix '-dev2'" app/build.gradle
          grep -F "orElse('2')" app/build.gradle
      - name: Fast unit tests
        run: gradle --no-daemon :app:testDevDebugUnitTest
      - name: Build app and instrumentation tests
        run: gradle --no-daemon :app:assembleDevDebug :app:assembleDevDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android runtime verification
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: gradle --no-daemon :app:connectedDevDebugAndroidTest
      - name: Verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: feature-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/tests/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
