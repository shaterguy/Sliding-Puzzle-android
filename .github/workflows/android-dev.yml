name: Android DEV verification and APK
on:
  push:
    branches: ['v0.1.0-dev*']
permissions:
  contents: read
concurrency:
  group: sliding-puzzle-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - name: Static preflight
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/AndroidManifest.xml
          test -d app/src/androidTest
          test -d app/src/test
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          import pathlib
          for path in pathlib.Path("app/src/main").rglob("*.xml"):
              ET.parse(path)
          print("XML syntax validated")
          PY
      - name: Fast unit tests
        run: gradle --no-daemon :app:testDevDebugUnitTest
      - name: Build app and compile instrumentation before emulator
        run: gradle --no-daemon :app:assembleDevDebug :app:assembleDevDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android runtime verification
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            gradle --no-daemon :app:connectedDevDebugAndroidTest
            mkdir -p runtime-evidence
            adb shell am start -n com.shaterguy.slidingpuzzle.dev/com.shaterguy.slidingpuzzle.MainActivity
            adb shell input keyevent 82
            adb exec-out screencap -p > runtime-evidence/home.png
      - name: Verify and identify canonical APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery
          cp app/build/outputs/apk/dev/debug/app-dev-debug.apk delivery/Sliding-Puzzle-0.1.0-dev1.apk
          cp runtime-evidence/home.png delivery/home.png
          sdk_tools="$ANDROID_HOME/build-tools/35.0.0"
          "$sdk_tools/apksigner" verify --verbose --print-certs delivery/Sliding-Puzzle-0.1.0-dev1.apk > delivery/signature.txt
          "$sdk_tools/aapt" dump badging delivery/Sliding-Puzzle-0.1.0-dev1.apk > delivery/package.txt
          grep -F "package: name='com.shaterguy.slidingpuzzle.dev'" delivery/package.txt
          grep -F "versionName='0.1.0-dev1'" delivery/package.txt
          cd delivery
          sha256sum Sliding-Puzzle-0.1.0-dev1.apk > SHA256SUMS
          printf 'source_sha=%s\nrun_id=%s\nrun_attempt=%s\nchannel=DEV\nsigning=ephemeral-debug\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > BUILD_IDENTITY.txt
      - name: Canonical verified APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: delivery/*
          if-no-files-found: error
          retention-days: 30
      - name: Verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/tests/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            runtime-evidence/
          if-no-files-found: warn
          retention-days: 30
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: delivery
      - name: Publish exact verified APK for direct installation
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          cd delivery
          sha256sum --check SHA256SUMS
          python3 - <<'PY'
          import os, pathlib, json, base64, hashlib, urllib.request, urllib.error
          repo = os.environ["REPOSITORY"]
          source = os.environ["SOURCE_SHA"]
          branch = "delivery/" + os.environ["SOURCE_BRANCH"]
          identity = source + "/" + os.environ["RUN_ID"] + "-" + os.environ["RUN_ATTEMPT"]
          api = "https://api.github.com/repos/" + repo
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
          def call(method, path, data=None):
              body = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(api + path, data=body, method=method, headers=headers)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)
          try:
              call("GET", "/git/ref/heads/" + branch)
          except urllib.error.HTTPError as e:
              if e.code != 404:
                  raise
              call("POST", "/git/refs", {"ref": "refs/heads/" + branch, "sha": source})
          for name in ["Sliding-Puzzle-0.1.0-dev1.apk", "SHA256SUMS", "BUILD_IDENTITY.txt", "signature.txt", "package.txt", "home.png"]:
              path = "dist/" + identity + "/" + name
              raw = pathlib.Path(name).read_bytes()
              content = base64.b64encode(raw).decode()
              try:
                  existing = call("GET", "/contents/" + path + "?ref=" + branch)
              except urllib.error.HTTPError as e:
                  if e.code != 404:
                      raise
                  existing = None
              if existing:
                  if existing["sha"] != hashlib.sha1(b"blob " + str(len(raw)).encode() + bytes([0]) + raw).hexdigest():
                      raise RuntimeError("Immutable delivery path content mismatch: " + path)
              else:
                  call("PUT", "/contents/" + path, {"message": "Deliver verified DEV artifact " + source, "branch": branch, "content": content})
          print("Direct APK: https://github.com/" + repo + "/raw/refs/heads/" + branch + "/dist/" + identity + "/Sliding-Puzzle-0.1.0-dev1.apk")
          PY
